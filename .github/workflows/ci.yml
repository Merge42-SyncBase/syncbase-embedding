name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"

      - run: go build ./...
      - run: go vet ./...
      # SYNCBASE_TEST_E5_MODEL_PATH etc. are intentionally left unset, so the
      # pinned-artifact integration test self-skips (it needs the real ONNX
      # model/runtime, which this workflow does not provision).
      - run: go test ./...

  # Builds the one-shot init container that downloads the pinned E5 model +
  # ONNX Runtime into a compose volume (used by syncbase-infra's `models`
  # service). Not the embedding library itself — a separate utility image.
  docker:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - id: vars
        run: echo "sha_short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ops/model/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha,scope=model-fetcher
          cache-to: type=gha,mode=max,scope=model-fetcher
          tags: |
            ghcr.io/merge42-syncbase/syncbase-model-fetcher:latest
            ghcr.io/merge42-syncbase/syncbase-model-fetcher:sha-${{ steps.vars.outputs.sha_short }}

  # Keeps syncbase-was's pinned version of this module current without a
  # human manually computing a pseudo-version after every merge.
  bump-was:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Merge42-SyncBase/syncbase-was
          token: ${{ secrets.GH_MODULES_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"

      - name: Configure private module access
        run: git config --global url."https://x-access-token:${{ secrets.GH_MODULES_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - run: |
          go env -w GOPRIVATE=github.com/Merge42-SyncBase/*
          go get github.com/Merge42-SyncBase/syncbase-embedding@${{ github.sha }}
          go mod tidy
          # -o /dev/null: avoids writing a binary to the working directory if
          # this pattern ever resolves to a single package (it currently
          # expands to 3: web/worker/migrate, but don't rely on that).
          go build -o /dev/null ./cmd/...

      - uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GH_MODULES_TOKEN }}
          commit-message: "chore: bump syncbase-embedding to ${{ github.sha }}"
          branch: chore/bump-syncbase-embedding
          delete-branch: true
          add-paths: |
            go.mod
            go.sum
          title: "chore: bump syncbase-embedding"
          body: |
            Auto-generated after a merge to `syncbase-embedding@main`
            (${{ github.sha }}). Review the diff, confirm CI passes, then merge.
