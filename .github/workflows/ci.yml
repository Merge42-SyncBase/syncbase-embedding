name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.6"

      - run: go build ./...
      - run: go vet ./...
      # SYNCBASE_TEST_E5_MODEL_PATH etc. are intentionally left unset, so the
      # pinned-artifact integration test self-skips (it needs the real ONNX
      # model/runtime, which this workflow does not provision).
      - run: go test ./...

  # Builds the one-shot init container that downloads the pinned E5 model +
  # ONNX Runtime into a compose volume (used by syncbase-infra's `models`
  # service). Not the embedding library itself — a separate utility image.
  docker:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - id: vars
        run: echo "sha_short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ops/model/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha,scope=model-fetcher
          cache-to: type=gha,mode=max,scope=model-fetcher
          tags: |
            ghcr.io/merge42-syncbase/syncbase-model-fetcher:latest
            ghcr.io/merge42-syncbase/syncbase-model-fetcher:sha-${{ steps.vars.outputs.sha_short }}
